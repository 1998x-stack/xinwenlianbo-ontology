<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>新闻联播 · 知识图谱</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color-scheme:dark;--bg:#0b1220;--panel:#172235;--line:#35465f;--text:#eef3fc;--muted:#b1c1d7;--blue:#8ab6ff;--focus:#ffdb86}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}a{color:var(--blue)}button{font:inherit;cursor:pointer;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px}button:hover,button.active{border-color:var(--blue);background:#294970}button:focus-visible,a:focus-visible,circle:focus-visible{outline:3px solid var(--focus);outline-offset:2px}header{position:fixed;inset:0 0 auto;z-index:10;padding:14px 20px;background:#0b1220ed;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:1.15rem;margin:0}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}.legend span:before{content:'●';margin-right:4px}.legend .news:before{color:#8ab6ff}.legend .person:before{color:#ff8b92}.legend .org:before{color:#85d8a5}.legend .topic:before{color:#ffca80}#graph{display:block;width:100vw;height:100vh}.controls{position:fixed;bottom:16px;left:16px;z-index:10;display:flex;gap:7px;flex-wrap:wrap;max-width:calc(100vw - 32px)}.tooltip{position:fixed;z-index:20;pointer-events:none;opacity:0;max-width:min(300px,80vw);padding:10px 13px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:.86rem;overflow-wrap:anywhere}.tooltip strong{display:block}.tooltip small{color:var(--muted)}.notice{position:fixed;left:16px;top:90px;z-index:10;padding:10px 13px;background:var(--panel);border:1px solid var(--line);border-radius:9px;max-width:400px;font-size:.85rem;color:var(--muted)}.detail{position:fixed;top:90px;right:16px;z-index:15;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:min(350px,calc(100vw - 32px));overflow-wrap:anywhere}.detail h2{font-size:1rem;margin:0 0 10px}.detail p{margin:6px 0;color:var(--muted)}.detail button{margin-top:10px}@media(max-width:600px){header{padding:9px 12px;gap:8px}.notice{top:115px;right:16px}.detail{top:115px}}
</style>
</head>
<body>
<header><a href="index.html">← 返回仪表板</a><h1>知识图谱</h1><div class="legend" aria-label="节点类型"><span class="news">新闻</span><span class="person">人物</span><span class="org">机构</span><span class="topic">主题</span></div></header>
<svg id="graph" role="img" aria-label="新闻、人物、机构、主题的关联图。可以使用下方筛选按钮或键盘选择节点。"></svg>
<p id="notice" class="notice" role="status" aria-live="polite">正在加载图谱数据快照…</p>
<div class="tooltip" id="tooltip" role="tooltip"><strong id="tooltip-label"></strong><small id="tooltip-info"></small></div>
<div class="controls" role="group" aria-label="筛选节点类型"><button type="button" data-type="all" class="active" aria-pressed="true">全部</button><button type="button" data-type="person" aria-pressed="false">人物</button><button type="button" data-type="org" aria-pressed="false">机构</button><button type="button" data-type="topic" aria-pressed="false">主题</button><button type="button" data-type="news" aria-pressed="false">新闻</button></div>
<aside id="detail" class="detail" hidden aria-live="polite"><h2 id="detail-label"></h2><p id="detail-info"></p><p id="detail-note">连线表示本数据集中记录的关联或共现，不等于因果关系；中心性数值也不代表现实中的重要性。</p><button id="detail-close" type="button">关闭详情</button></aside>
<script>
'use strict';
const colors = {news:'#8ab6ff',person:'#ff8b92',org:'#85d8a5',topic:'#ffca80'};
const radii = {news:4,person:6,org:5,topic:6};
let simulation, circles, labels, lines, selectedType = 'all';
const $ = id => document.getElementById(id);
function radius(node) {
  const score = Number(node.pagerank);
  const safe = Number.isFinite(score) ? Math.max(0,Math.min(1,score)) : 0;
  return (radii[node.type] || 4) + safe * (node.type === 'news' ? 14 : 18);
}
function showDetail(node) {
  $('detail-label').textContent = String(node.label || node.id || '未知节点');
  const info = [node.type,node.date, node.count == null ? null : `${node.count} 条关联报道`];
  $('detail-info').textContent = info.filter(value => value !== null && value !== undefined).join(' · ');
  $('detail').hidden = false;
  $('detail-close').focus();
}
function setFilter(type) {
  selectedType = type;
  document.querySelectorAll('.controls button').forEach(button => {
    const active = button.dataset.type === type;
    button.classList.toggle('active',active);
    button.setAttribute('aria-pressed',String(active));
  });
  if (!circles) return;
  circles.attr('opacity',node => type === 'all' ? (node.type === 'news' ? .40 : .86) : (node.type === type ? 1 : .04));
  labels.attr('opacity',node => type === 'all' || node.type === type ? 1 : 0);
  lines.attr('opacity',type === 'all' ? .6 : .05);
}
function renderGraph(graph) {
  if (!Array.isArray(graph.nodes) || !Array.isArray(graph.edges)) throw new Error('图谱数据格式不符合预期');
  const width = window.innerWidth, height = window.innerHeight;
  const nodes = graph.nodes.map(node => ({...node}));
  const byId = new Map(nodes.map(node => [node.id,node]));
  const edges = graph.edges.filter(edge => byId.has(edge.source) && byId.has(edge.target)).map(edge => ({...edge}));
  const svg = d3.select('#graph').attr('viewBox',[0,0,width,height]);
  svg.selectAll('*').remove();
  const layer = svg.append('g');
  svg.call(d3.zoom().scaleExtent([.15,6]).on('zoom',event => layer.attr('transform',event.transform)));
  simulation = d3.forceSimulation(nodes)
    .force('link',d3.forceLink(edges).id(node => node.id).distance(edge => edge.type === 'co_occur' ? 45 : 75))
    .force('charge',d3.forceManyBody().strength(-120))
    .force('center',d3.forceCenter(width/2,height/2))
    .force('collision',d3.forceCollide().radius(node => radius(node)+5));
  lines = layer.append('g').selectAll('line').data(edges).join('line')
    .attr('stroke',edge => edge.type === 'co_occur' ? '#ff8b92' : edge.type === 'about' ? '#ffca80' : '#9aacc7')
    .attr('stroke-opacity',.45).attr('stroke-width',edge => edge.type === 'co_occur' ? Math.min(Number(edge.weight)||1,3) : .8);
  circles = layer.append('g').selectAll('circle').data(nodes).join('circle')
    .attr('r',radius).attr('fill',node => colors[node.type] || '#bbc7d6')
    .attr('stroke','#172235').attr('stroke-width',1.5).attr('tabindex',0)
    .attr('role','button').attr('aria-label',node => `${node.type}：${node.label || node.id}`)
    .call(d3.drag()
      .on('start',(event,node) => { if (!event.active) simulation.alphaTarget(.3).restart(); node.fx=node.x;node.fy=node.y; })
      .on('drag',(event,node) => { node.fx=event.x;node.fy=event.y; })
      .on('end',(event,node) => { if (!event.active) simulation.alphaTarget(0);node.fx=null;node.fy=null; }));
  labels = layer.append('g').selectAll('text').data(nodes.filter(node => node.type !== 'news')).join('text')
    .text(node => String(node.label || '').slice(0,10))
    .attr('font-size',10).attr('fill','#d7e3f2').attr('text-anchor','middle')
    .attr('dy',node => radius(node)+12).attr('pointer-events','none');
  circles.on('mouseenter',(event,node) => {
    $('tooltip-label').textContent = String(node.label || node.id || '');
    $('tooltip-info').textContent = [node.type,node.date,node.count].filter(value => value !== null && value !== undefined).join(' · ');
    $('tooltip').style.opacity='1';
  }).on('mousemove',event => {
    $('tooltip').style.left = `${Math.min(window.innerWidth-130,event.clientX+15)}px`;
    $('tooltip').style.top = `${Math.max(10,event.clientY-40)}px`;
  }).on('mouseleave',() => { $('tooltip').style.opacity='0'; })
    .on('click',(event,node) => showDetail(node))
    .on('keydown',(event,node) => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault();showDetail(node); }
    });
  simulation.on('tick',() => {
    lines.attr('x1',edge => edge.source.x).attr('y1',edge => edge.source.y)
      .attr('x2',edge => edge.target.x).attr('y2',edge => edge.target.y);
    circles.attr('cx',node => node.x).attr('cy',node => node.y);
    labels.attr('x',node => node.x).attr('y',node => node.y);
  });
  setFilter(selectedType);
  return {nodes,edges};
}
document.querySelectorAll('.controls button').forEach(button =>
  button.addEventListener('click',() => setFilter(button.dataset.type)));
$('detail-close').addEventListener('click',() => { $('detail').hidden=true; });
window.addEventListener('resize',() => {
  const svg = d3.select('#graph').attr('viewBox',[0,0,window.innerWidth,window.innerHeight]);
  if (simulation) simulation.force('center',d3.forceCenter(window.innerWidth/2,window.innerHeight/2)).alpha(.3).restart();
});
(async () => {
  try {
    if (typeof d3 === 'undefined') throw new Error('D3 可视化脚本加载失败');
    const response = await fetch('../data/graph.json');
    if (!response.ok) throw new Error('未找到 graph.json，请先运行 db/export_graph.py');
    const graph = renderGraph(await response.json());
    $('notice').textContent = `本地数据快照：${graph.nodes.length} 个节点，${graph.edges.length} 条关联。`;
  } catch (error) {
    $('notice').textContent = `图谱加载失败：${String(error.message)}。请通过项目根目录的 HTTP 服务打开本页面。`;
  }
})();
</script>
</body>
</html>
