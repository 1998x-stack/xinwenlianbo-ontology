<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新闻联播 Ontology Explorer</title>
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface2: #232738; --border: #2a2e3e;
  --text: #e1e4e8; --text2: #8b90a0; --text3: #5a5f72; --accent: #4f8ff7;
  --orange: #f39c12; --green: #2ecc71;
  --radius: 10px; --radius-sm: 6px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 14px; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }
::selection { background: var(--accent); color: #fff; }
.app { max-width: 1440px; margin: 0 auto; padding: 20px 20px 40px; }
header { margin-bottom: 20px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
header h1 { font-size: 1.8rem; font-weight: 700; background: linear-gradient(135deg, #e1e4e8 0%, var(--accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.subtitle { font-size: 0.9rem; color: var(--text2); margin-top: 4px; }
.subtitle strong { color: var(--text); }
.stats-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
.stat-pill { padding: 6px 14px; border-radius: 20px; font-size: 0.82rem; background: var(--surface); border: 1px solid var(--border); color: var(--text2); display: flex; align-items: center; gap: 6px; }
.stat-pill strong { color: var(--text); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; align-items: center; }
.search-box { flex: 1; min-width: 200px; position: relative; }
.search-box input { width: 100%; padding: 10px 14px 10px 38px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 0.95rem; font-family: var(--font); outline: none; }
.search-box input:focus { border-color: var(--accent); }
.search-box .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
.clear-btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text2); cursor: pointer; font-size: 0.85rem; font-family: var(--font); }
.clear-btn:hover { border-color: var(--accent); color: var(--accent); }
.clear-btn:disabled { opacity: 0.3; cursor: default; }
.filter-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-tag { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; background: var(--accent); color: #fff; cursor: pointer; }
.filter-tag:hover { opacity: 0.8; }
.dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.full-width { grid-column: 1 / -1; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
.card-title { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text2); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
.card-title .badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; background: var(--surface2); color: var(--text2); }
/* Timeline */
.timeline { display: flex; flex-direction: column; gap: 5px; max-height: 420px; overflow-y: auto; }
.timeline-row { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 6px; border-radius: var(--radius-sm); transition: background .15s; }
.timeline-row:hover { background: var(--surface2); }
.timeline-row.active { background: rgba(79,143,247,0.12); }
.timeline-label { min-width: 90px; font-size: 0.78rem; color: var(--text2); text-align: right; flex-shrink: 0; }
.timeline-bar-wrap { flex: 1; height: 24px; background: var(--surface2); border-radius: 4px; overflow: hidden; min-width: 0; }
.timeline-bar-fill { height: 100%; border-radius: 4px; background: var(--accent); opacity: 0.7; transition: width .4s ease; }
.timeline-count { font-size: 0.75rem; color: var(--text3); min-width: 30px; flex-shrink: 0; }
/* Topics */
.topic-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.topic-tile { padding: 10px 14px; border-radius: var(--radius-sm); cursor: pointer; transition: all .2s ease; border: 1px solid transparent; flex: 1 1 auto; min-width: 80px; }
.topic-tile:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
.topic-tile.active { border-color: var(--accent); }
.topic-tile .name { font-size: 0.82rem; font-weight: 600; line-height: 1.3; }
.topic-tile .count { font-size: 0.7rem; opacity: 0.8; margin-top: 2px; }
/* News List */
.news-list { max-height: 520px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.news-list::-webkit-scrollbar { width: 5px; }
.news-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.news-item { padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s; }
.news-item:hover { background: rgba(79,143,247,0.04); }
.news-item:last-child { border-bottom: none; }
.news-item .title { font-size: 0.9rem; font-weight: 600; line-height: 1.4; }
.news-item .meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 0.75rem; color: var(--text2); margin: 4px 0; align-items: center; }
.news-item .meta .date-badge { padding: 1px 6px; border-radius: 3px; background: var(--surface2); }
.news-item .excerpt { font-size: 0.78rem; color: var(--text3); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.news-item .chip-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { padding: 1px 7px; border-radius: 3px; font-size: 0.7rem; color: #fff; }
.chip.keyword { background: rgba(79,143,247,0.25); color: var(--accent); }
.news-empty { text-align: center; padding: 40px 20px; color: var(--text3); }
/* Person Board */
.person-list { display: flex; flex-direction: column; gap: 5px; }
.person-row { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px 8px; border-radius: var(--radius-sm); transition: background .15s; }
.person-row:hover { background: var(--surface2); }
.person-row.active { background: rgba(79,143,247,0.12); }
.person-rank { width: 22px; font-size: 0.75rem; color: var(--text3); text-align: center; flex-shrink: 0; font-weight: 600; }
.person-bar-wrap { flex: 1; height: 24px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.person-bar-fill { height: 100%; border-radius: 4px; transition: width .4s ease; background: var(--accent); opacity: 0.7; }
.person-row.top1 .person-bar-fill { opacity: 1; background: linear-gradient(90deg, #f7b731, #f39c12); }
.person-row.top2 .person-bar-fill { opacity: 0.9; background: linear-gradient(90deg, #4f8ff7, #3a7bdf); }
.person-row.top3 .person-bar-fill { opacity: 0.85; background: linear-gradient(90deg, #2ecc71, #27ae60); }
.person-name { min-width: 80px; font-size: 0.82rem; font-weight: 500; flex-shrink: 0; }
.person-count { min-width: 28px; font-size: 0.78rem; color: var(--text2); text-align: right; flex-shrink: 0; }
/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); max-width: 720px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 28px; position: relative; }
.modal-close { position: absolute; top: 16px; right: 18px; background: none; border: none; color: var(--text3); font-size: 1.5rem; cursor: pointer; }
.modal-close:hover { color: var(--text); }
.modal h2 { font-size: 1.2rem; font-weight: 700; line-height: 1.4; margin-bottom: 12px; padding-right: 30px; }
.modal .detail-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; font-size: 0.82rem; color: var(--text2); }
.modal .detail-summary { font-size: 0.88rem; line-height: 1.7; color: var(--text); padding: 12px; background: var(--surface2); border-radius: var(--radius-sm); border-left: 3px solid var(--accent); margin-bottom: 14px; }
.modal .detail-section { margin-bottom: 14px; }
.modal .detail-section h3 { font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3); margin-bottom: 6px; }
.signal-item { padding: 8px 12px; margin: 4px 0; border-radius: var(--radius-sm); background: rgba(243,156,18,0.08); border-left: 3px solid var(--orange); font-size: 0.82rem; }
.signal-item .sig-type { font-size: 0.7rem; padding: 1px 6px; border-radius: 3px; background: var(--orange); color: #fff; margin-right: 8px; }
.loading-state { grid-column: 1 / -1; text-align: center; padding: 80px 20px; color: var(--text3); }
.loading-state .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 20px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 900px) { .dashboard { grid-template-columns: 1fr; } .full-width { grid-column: 1; } }
@media (max-width: 480px) { header { flex-direction: column; } .toolbar { flex-direction: column; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>新闻联播 Ontology Explorer</h1><div class="subtitle" id="subtitle">Loading...</div></div>
  </header>
  <div class="stats-bar" id="statsBar"></div>
  <div class="toolbar">
    <div class="search-box"><span class="icon">&#x1F50D;</span><input type="text" id="searchInput" placeholder="搜索标题、摘要、关键词、人物..." autocomplete="off"></div>
    <button class="clear-btn" id="clearBtn" disabled>清除筛选</button>
    <div class="filter-tags" id="filterTags"></div>
  </div>
  <div class="dashboard" id="dashboard"></div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" id="modalClose">&times;</button>
    <h2 id="modalTitle"></h2>
    <div class="detail-meta" id="modalMeta"></div>
    <div id="modalSummary"></div>
    <div id="modalTopics"></div>
    <div id="modalKeywords"></div>
    <div id="modalPeople"></div>
    <div id="modalOrgs"></div>
    <div id="modalSignals"></div>
    <div id="modalText"></div>
  </div>
</div>

<script>
const state = { items: [], topics: [], dates: [], events: [], filters: { date: null, topic: null, person: null, search: '' }, filtered: [] };
const COLORS = ['#4f8ff7','#e74c3c','#f39c12','#2ecc71','#9b59b6','#1abc9c','#e91e63','#0dceda','#c0392b','#f7b731'];

function topicColor(t) { return COLORS[((t.topic_id || t.name || '').length) % COLORS.length]; }

async function loadData() {
  const base = '..';
  const [iResp, tResp, dResp, eResp] = await Promise.all([
    fetch(base + '/data/news_items.jsonl'),
    fetch(base + '/data/topics.json'),
    fetch(base + '/data/dates.json'),
    fetch(base + '/data/events.json'),
  ]);
  if (!iResp.ok) throw new Error('Data files not found. Run: cd db && python3 export_jsonl.py');
  const items = (await iResp.text()).trim().split('\n').filter(Boolean).map(JSON.parse);
  return { items, topics: await tResp.json(), dates: await dResp.json(), events: eResp.ok ? await eResp.json() : [] };
}

function computePersonCounts(items) {
  const map = {};
  for (const it of items) for (const p of (it.people || [])) { const n = p.name_chinese || p.name; map[n] = (map[n] || 0) + 1; }
  return Object.entries(map).map(([n, c]) => ({ name: n, count: c })).sort((a, b) => b.count - a.count);
}

function applyFilters() {
  let f = state.items;
  const { date, topic, person, search } = state.filters;
  if (date) f = f.filter(it => it.broadcast_date === date);
  if (topic) f = f.filter(it => (it.topics || []).some(t => t.topic_id === topic || t.name === topic));
  if (person) f = f.filter(it => (it.people || []).some(p => (p.name_chinese || p.name) === person));
  if (search) { const q = search.toLowerCase(); f = f.filter(it => it.title.toLowerCase().includes(q) || (it.summary || '').toLowerCase().includes(q) || (it.keywords || []).some(k => (k || '').toLowerCase().includes(q))); }
  state.filtered = f;
}

function setFilter(key, val) { if (state.filters[key] === val) state.filters[key] = null; else state.filters[key] = val; applyFilters(); saveHash(); renderAll(); }
function clearFilters() { state.filters = { date: null, topic: null, person: null, search: '' }; document.getElementById('searchInput').value = ''; applyFilters(); saveHash(); renderAll(); }
function hasFilters() { const f = state.filters; return f.date || f.topic || f.person || f.search; }
function saveHash() { const p = []; const f = state.filters; if (f.date) p.push('date=' + encodeURIComponent(f.date)); if (f.topic) p.push('topic=' + encodeURIComponent(f.topic)); if (f.person) p.push('person=' + encodeURIComponent(f.person)); if (f.search) p.push('search=' + encodeURIComponent(f.search)); window.location.hash = p.length ? '#' + p.join('&') : ''; }
function loadHash() { if (!window.location.hash) return; const p = new URLSearchParams(window.location.hash.slice(1)); state.filters.date = p.get('date') || null; state.filters.topic = p.get('topic') || null; state.filters.person = p.get('person') || null; const s = p.get('search'); if (s) { state.filters.search = s; document.getElementById('searchInput').value = s; } applyFilters(); }

function renderAll() {
  const db = document.getElementById('dashboard'); db.innerHTML = '';
  renderStats(); renderTimeline(db); renderTopicGrid(db); renderNewsList(db); renderPersonBoard(db); renderEventGantt(db); renderFilterTags();
  const items = state.items, dates = state.dates;
  const auCount = new Set(items.flatMap(it => (it.people || []).map(p => p.name_chinese || p.name))).size;
  document.getElementById('subtitle').innerHTML = items.length ? `<strong>${dates.length}</strong> 天 · <strong>${items.length}</strong> 条新闻 · <strong>${auCount}</strong> 位人物 · <strong>${state.topics.length}</strong> 个主题` : 'Loading...';
  document.getElementById('clearBtn').disabled = !hasFilters();
}

function renderStats() {
  const items = state.filtered;
  const enhanced = items.filter(it => it.summary).length;
  const signals = items.flatMap(it => ((it.tags || {})._policy_signals || []));
  document.getElementById('statsBar').innerHTML = `<div class="stat-pill">筛选结果 <strong>${items.length}</strong> 条</div><div class="stat-pill">AI增强 <strong>${enhanced}</strong> 条</div>${signals.length ? `<div class="stat-pill" style="border-color:var(--orange);color:var(--orange)">政策信号 <strong>${signals.length}</strong> 条</div>` : ''}`;
}

function renderFilterTags() {
  const c = document.getElementById('filterTags'), f = state.filters;
  const tags = [];
  if (f.date) tags.push({ key: 'date', label: f.date });
  if (f.topic) { const t = state.topics.find(t => t.topic_id === f.topic || t.name === f.topic); tags.push({ key: 'topic', label: t ? t.name : f.topic }); }
  if (f.person) tags.push({ key: 'person', label: f.person });
  if (f.search) tags.push({ key: 'search', label: '"' + f.search + '"' });
  if (!tags.length) { c.innerHTML = ''; return; }
  c.innerHTML = tags.map(t => `<span class="filter-tag" data-key="${t.key}">${t.label}<span style="margin-left:2px;font-size:1rem">&times;</span></span>`).join('');
  c.querySelectorAll('.filter-tag').forEach(el => el.addEventListener('click', () => { const k = el.dataset.key; state.filters[k] = null; if (k === 'search') document.getElementById('searchInput').value = ''; applyFilters(); saveHash(); renderAll(); }));
}

function renderTimeline(db) {
  const maxItems = Math.max(...state.dates.map(d => d.item_count), 1);
  let h = `<div class="card full-width"><div class="card-title">每日新闻数量 <span class="badge">点击筛选</span></div><div class="timeline">`;
  for (const d of state.dates) {
    const active = state.filters.date === d.date;
    h += `<div class="timeline-row${active ? ' active' : ''}" data-date="${d.date}"><div class="timeline-label">${d.date}</div><div class="timeline-bar-wrap"><div class="timeline-bar-fill" style="width:${(d.item_count / maxItems * 100).toFixed(1)}%"></div></div><div class="timeline-count">${d.item_count}</div></div>`;
  }
  h += `</div></div>`; db.insertAdjacentHTML('beforeend', h);
  db.querySelectorAll('.timeline-row').forEach(r => r.addEventListener('click', () => setFilter('date', r.dataset.date)));
}

function renderTopicGrid(db) {
  const top = [...state.topics].sort((a, b) => b.article_count - a.article_count).slice(0, 15);
  const mx = top[0]?.article_count || 1;
  let h = `<div class="card"><div class="card-title">主题 <span class="badge">${state.topics.length} total</span></div><div class="topic-grid">`;
  for (const t of top) {
    const active = state.filters.topic === t.topic_id, color = topicColor(t);
    h += `<div class="topic-tile${active ? ' active' : ''}" data-topic="${t.topic_id}" style="background:${color}18;border-color:${color}33"><div class="name">${t.name}</div><div class="count">${t.article_count} 条</div></div>`;
  }
  h += `</div></div>`; db.insertAdjacentHTML('beforeend', h);
  db.querySelectorAll('.topic-tile').forEach(el => el.addEventListener('click', () => setFilter('topic', el.dataset.topic)));
}

function renderNewsList(db) {
  const items = state.filtered;
  let h = `<div class="card"><div class="card-title">新闻列表 <span class="badge">${items.length} / ${state.items.length}</span></div><div class="news-list">`;
  if (!items.length) { h += `<div class="news-empty">没有匹配当前筛选条件的新闻。</div>`; }
  else for (const it of items) {
    const people = (it.people || []).map(p => p.name_chinese || p.name).join(', ');
    h += `<div class="news-item" data-id="${it.news_id}"><div class="meta"><span class="date-badge">${it.broadcast_date}</span>${people ? `<span>${people}</span>` : ''}${it.word_count ? `<span>${it.word_count.toLocaleString()} 字</span>` : ''}</div><div class="title">${it.title}</div>`;
    const kws = it.keywords || [];
    if (kws.length) h += `<div class="chip-row">${kws.slice(0, 6).map(k => `<span class="chip keyword">${k}</span>`).join('')}</div>`;
    if (it.topics && it.topics.length) h += `<div class="chip-row">${it.topics.slice(0, 4).map(t => `<span class="chip" style="background:${topicColor(t)}">${t.name}</span>`).join('')}</div>`;
    const excerpt = it.summary || it.excerpt || '';
    if (excerpt) h += `<div class="excerpt">${excerpt.substring(0, 200)}${excerpt.length >= 200 ? '...' : ''}</div>`;
    h += `</div>`;
  }
  h += `</div></div>`; db.insertAdjacentHTML('beforeend', h);
  db.querySelectorAll('.news-item').forEach(el => el.addEventListener('click', () => { const it = state.items.find(x => x.news_id === el.dataset.id); if (it) showModal(it); }));
}

function renderPersonBoard(db) {
  const people = computePersonCounts(state.filtered);
  const top = people.slice(0, 15), mx = top[0]?.count || 1;
  let h = `<div class="card full-width"><div class="card-title">人物榜 <span class="badge">${people.length} 位</span></div><div class="person-list">`;
  for (let i = 0; i < top.length; i++) {
    const p = top[i], active = state.filters.person === p.name, rc = i < 3 ? ` top${i + 1}` : '';
    h += `<div class="person-row${active ? ' active' : ''}${rc}" data-person="${p.name}"><div class="person-rank">${i + 1}</div><div class="person-name">${p.name}</div><div class="person-bar-wrap"><div class="person-bar-fill" style="width:${(p.count / mx * 100).toFixed(1)}%"></div></div><div class="person-count">${p.count}</div></div>`;
  }
  h += `</div></div>`; db.insertAdjacentHTML('beforeend', h);
  db.querySelectorAll('.person-row').forEach(r => r.addEventListener('click', () => setFilter('person', r.dataset.person)));
}

function renderEventGantt(db) {
  if (!state.events.length) return;
  const top = [...state.events].sort((a,b) => (b.heat_score||0) - (a.heat_score||0)).slice(0, 10);
  const importanceColors = {critical:'#e74c3c',major:'#f39c12',notable:'#4f8ff7',routine:'#7f8c8d'};
  let h = '<div class="card full-width"><div class="card-title">事件时间线 <span class="badge">' + state.events.length + ' events</span></div><div style="display:flex;flex-direction:column;gap:6px">';
  for (const e of top) {
    const color = importanceColors[e.importance] || '#7f8c8d';
    h += '<div class="news-item" data-eid="' + e.event_id + '" style="cursor:pointer"><div class="title">' + e.name.substring(0,40) + '</div><div class="meta"><span style="color:' + color + '">' + e.importance + '</span><span>' + e.status + '</span><span>' + e.first_date + ' → ' + e.last_date + '</span><span>' + e.news_count + ' items</span></div></div>';
  }
  h += '</div></div>';
  db.insertAdjacentHTML('beforeend', h);
  db.querySelectorAll('[data-eid]').forEach(el => el.addEventListener('click', () => {
    const e = state.events.find(x => x.event_id === el.dataset.eid);
    if (e) showEventModal(e);
  }));
}

function showEventModal(e) {
  document.getElementById('modalTitle').textContent = e.name;
  document.getElementById('modalMeta').innerHTML = '<span>' + e.type + '</span><span style="opacity:0.3">|</span><span>' + e.importance + '</span><span style="opacity:0.3">|</span><span>' + e.status + '</span><span style="opacity:0.3">|</span><span>Heat: ' + (e.heat_score||0).toFixed(0) + '</span>';

  const sumEl = document.getElementById('modalSummary');
  sumEl.innerHTML = e.summary ? '<div class="detail-summary">' + e.summary + '</div>' : '';
  sumEl.style.display = e.summary ? '' : 'none';

  let itemsHTML = '<h3>时间线</h3>';
  for (const it of (e.items || [])) {
    itemsHTML += '<div style="padding:4px 0;font-size:0.82rem"><span style="color:var(--text3)">' + it.date + '</span> ' + it.title.substring(0,80) + '</div>';
  }
  document.getElementById('modalTopics').innerHTML = itemsHTML;
  document.getElementById('modalTopics').style.display = '';

  let actorsHTML = '';
  if (e.key_persons && e.key_persons.length) {
    actorsHTML = '<h3>关键人物</h3><div class="chip-row">' + e.key_persons.map(p => '<span class="chip" style="background:#e74c3c">' + p.name + '</span>').join('') + '</div>';
  }
  document.getElementById('modalPeople').innerHTML = actorsHTML;
  document.getElementById('modalPeople').style.display = actorsHTML ? '' : 'none';

  document.getElementById('modalKeywords').style.display = 'none';
  document.getElementById('modalOrgs').style.display = 'none';
  document.getElementById('modalSignals').style.display = 'none';
  document.getElementById('modalText').style.display = 'none';

  document.getElementById('modal').classList.add('open');
}

function showModal(it) {
  document.getElementById('modalTitle').textContent = it.title;
  document.getElementById('modalMeta').innerHTML = `<span>${it.broadcast_date}</span><span style="opacity:0.3">|</span><span>#${it.order_in_broadcast}</span>${it.word_count ? `<span style="opacity:0.3">|</span><span>${it.word_count.toLocaleString()} 字</span>` : ''}`;

  const sumEl = document.getElementById('modalSummary');
  if (it.summary) { sumEl.innerHTML = `<div class="detail-summary">${it.summary}</div>`; sumEl.style.display = ''; } else sumEl.style.display = 'none';

  const topEl = document.getElementById('modalTopics');
  if (it.topics && it.topics.length) { topEl.innerHTML = `<h3>主题</h3><div class="chip-row">${it.topics.map(t => `<span class="chip" style="background:${topicColor(t)}">${t.name}</span>`).join('')}</div>`; topEl.style.display = ''; } else topEl.style.display = 'none';

  const kwEl = document.getElementById('modalKeywords');
  if (it.keywords && it.keywords.length) { kwEl.innerHTML = `<h3>关键词</h3><div class="chip-row">${it.keywords.map(k => `<span class="chip keyword">${k}</span>`).join('')}</div>`; kwEl.style.display = ''; } else kwEl.style.display = 'none';

  const peEl = document.getElementById('modalPeople');
  if (it.people && it.people.length) { peEl.innerHTML = `<h3>人物</h3><div class="chip-row">${it.people.map(p => `<span class="chip" style="background:${COLORS[1]}">${p.name_chinese || p.name}${p.title ? ' (' + p.title + ')' : ''}</span>`).join('')}</div>`; peEl.style.display = ''; } else peEl.style.display = 'none';

  const orgEl = document.getElementById('modalOrgs');
  if (it.organizations && it.organizations.length) { orgEl.innerHTML = `<h3>机构</h3><div class="chip-row">${it.organizations.map(o => `<span class="chip" style="background:${COLORS[3]}">${o.name}</span>`).join('')}</div>`; orgEl.style.display = ''; } else orgEl.style.display = 'none';

  const sigEl = document.getElementById('modalSignals');
  const signals = ((it.tags || {})._policy_signals || []);
  if (signals.length) { sigEl.innerHTML = `<h3>政策信号 (${signals.length})</h3>${signals.map(s => { const sig = typeof s === 'string' ? s : (s.signal || ''); const type = typeof s === 'object' ? (s.type || '') : ''; return `<div class="signal-item">${type ? `<span class="sig-type">${type}</span>` : ''}${sig}</div>`; }).join('')}`; sigEl.style.display = ''; } else sigEl.style.display = 'none';

  const txtEl = document.getElementById('modalText');
  if (it.excerpt) { txtEl.innerHTML = `<h3>正文预览</h3><div style="font-size:0.86rem;line-height:1.8;color:var(--text2);white-space:pre-line;max-height:300px;overflow-y:auto">${it.excerpt}</div>`; txtEl.style.display = ''; } else txtEl.style.display = 'none';

  document.getElementById('modal').classList.add('open');
}

async function init() {
  const db = document.getElementById('dashboard');
  try {
    db.innerHTML = `<div class="loading-state"><div class="spinner"></div><h2>加载数据中...</h2><p>正在获取新闻、主题和日期数据</p></div>`;
    const data = await loadData();
    state.items = data.items; state.topics = data.topics; state.dates = data.dates; state.events = data.events;
    state.filtered = data.items;
    loadHash(); renderAll();
  } catch (err) {
    console.error(err);
    db.innerHTML = `<div class="full-width" style="text-align:center;padding:80px 20px"><div style="width:60px;height:60px;border-radius:50%;border:2px solid var(--border);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--text3)">!</div><h2 style="color:var(--text2)">数据文件未生成</h2><p style="font-size:0.9rem;color:var(--text3);margin-top:8px">请先运行:</p><code style="display:inline-block;padding:4px 10px;background:var(--surface2);border-radius:4px;margin-top:12px">cd db && python3 export_jsonl.py</code><p style="margin-top:8px;font-size:0.8rem;color:var(--text3)">${err.message}</p></div>`;
  }
}

document.getElementById('clearBtn').addEventListener('click', clearFilters);
document.getElementById('searchInput').addEventListener('input', e => { state.filters.search = e.target.value.trim(); applyFilters(); saveHash(); renderAll(); });
document.getElementById('modalClose').addEventListener('click', () => document.getElementById('modal').classList.remove('open'));
document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) document.getElementById('modal').classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('modal').classList.remove('open'); });

init();
</script>
</body>
</html>
