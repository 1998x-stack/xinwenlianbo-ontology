<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>新闻联播 · 数据与事件观察</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color-scheme:dark;--bg:#0b1220;--panel:#172235;--panel2:#1f3049;--line:#35465f;--text:#eef3fc;--muted:#b1c1d7;--blue:#8ab6ff;--focus:#ffdb86}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.5}a{color:var(--blue)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.5}.wrap{max-width:1500px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:24px}h1{font-size:clamp(1.4rem,3vw,2.2rem);margin:0}h2{font-size:1.08rem;margin:0 0 14px}h3{font-size:1rem;margin:0}.muted{color:var(--muted)}.note{font-size:.85rem}.nav{display:flex;gap:16px;flex-wrap:wrap}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}.search{flex:1;min-width:220px;padding:11px 13px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:9px}.btn,.pill,.entry,.tile{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 12px}.btn:hover,.entry:hover,.tile:hover,.pill:hover{border-color:var(--blue)}.active{border-color:var(--blue)!important;background:#294970!important}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.panel{padding:19px;background:var(--panel);border:1px solid var(--line);border-radius:13px;min-width:0}.wide{grid-column:1/-1}.kpis{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 16px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 14px}.kpi strong{color:var(--blue);font-variant-numeric:tabular-nums}.list{display:flex;flex-direction:column;gap:8px;max-height:520px;overflow-y:auto}.entry{display:block;width:100%;text-align:left;white-space:normal}.entry strong{display:block;margin:3px 0}.entry small{color:var(--muted);display:block}.tiles{display:flex;gap:7px;flex-wrap:wrap}.tile{min-width:100px;text-align:left}.tile small{display:block;color:var(--muted)}.bar{display:block;height:5px;background:#75adff;border-radius:5px;margin-top:6px;min-width:1px}.timeline-row{display:grid;grid-template-columns:95px minmax(0,1fr) 40px;gap:9px;align-items:center}.timeline-row .bar{height:8px;margin:0}.timeline-row span:last-child{text-align:right;font-variant-numeric:tabular-nums}.timeline-list{display:flex;flex-direction:column;gap:7px;max-height:340px;overflow:auto}.timeline-row{padding:7px 9px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}.tag{border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:.8rem;color:var(--muted)}.empty{padding:24px;color:var(--muted);text-align:center}.status{padding:10px 14px;margin-bottom:14px;border-left:4px solid var(--blue);background:var(--panel)}dialog{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(740px,calc(100% - 24px));max-height:85vh;padding:24px}dialog::backdrop{background:#050a14df}.modal-head{display:flex;justify-content:space-between;align-items:start;gap:12px}.modal-head h2{margin-top:0;font-size:1.25rem}.modal-body section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.modal-body p{white-space:pre-wrap;overflow-wrap:anywhere}.count{color:var(--muted);font-size:.87rem;margin-bottom:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}.wide{grid-column:1}.wrap{padding:14px}}@media(prefers-reduced-motion:no-preference){button{transition:border-color .15s,background .15s}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>新闻联播 · 数据与事件观察</h1><p id="coverage" class="muted note">正在加载数据…</p></div><nav class="nav" aria-label="视图导航"><a href="graph.html">知识图谱</a><a href="../README.md">项目说明</a></nav></header>
<p id="status" class="status" role="status" aria-live="polite">正在加载本地数据快照…</p>
<div class="toolbar"><label for="search" class="muted">检索</label><input class="search" id="search" type="search" placeholder="标题、摘要、关键词、人物、机构" autocomplete="off"><button class="btn" type="button" id="clear">清除筛选</button></div>
<div id="filters" class="tags" aria-live="polite"></div><div id="kpis" class="kpis"></div>
<main class="grid">
<section class="panel wide" aria-labelledby="dates-heading"><h2 id="dates-heading">按播出日期筛选</h2><div class="timeline-list" id="dates"></div></section>
<section class="panel" aria-labelledby="topics-heading"><h2 id="topics-heading">主题</h2><div id="topics" class="tiles"></div></section>
<section class="panel" aria-labelledby="people-heading"><h2 id="people-heading">人物（当前筛选结果）</h2><div id="people" class="list"></div></section>
<section class="panel wide" aria-labelledby="events-heading"><h2 id="events-heading">事件聚类（算法推断）</h2><div id="events" class="list"></div></section>
<section class="panel wide" aria-labelledby="news-heading"><h2 id="news-heading">新闻条目</h2><p id="result-count" class="count"></p><div id="news" class="list"></div><button id="more" class="btn" type="button" hidden>显示更多</button></section>
</main></div>
<dialog id="detail" aria-labelledby="detail-title"><div class="modal-head"><h2 id="detail-title"></h2><button id="close" class="btn" type="button" aria-label="关闭详情">关闭</button></div><div id="detail-body" class="modal-body"></div></dialog>
<script>
'use strict';
const $ = id => document.getElementById(id);
const state = { items:[], topics:[], dates:[], events:[], filtered:[], filters:{date:null,topic:null,person:null,search:''}, shown:60 };
let previousFocus = null;
function node(tag, className='', value=null) {
  const item = document.createElement(tag);
  if (className) item.className = className;
  if (value !== null && value !== undefined) item.textContent = String(value);
  return item;
}
function add(parent, ...children) { parent.append(...children); return parent; }
function clear(parent) { parent.replaceChildren(); return parent; }
function text(value) { return value === null || value === undefined ? '' : String(value); }
function empty(parent, message) { add(parent, node('p','empty',message)); }
function action(label, handler, className='btn') {
  const button = node('button', className, label);
  button.type = 'button'; button.addEventListener('click', handler);
  return button;
}
function updateFilter(key, value) {
  state.filters[key] = state.filters[key] === value ? null : value;
  state.shown = 60; syncHash(); render();
}
function syncHash() {
  const params = new URLSearchParams();
  for (const [key, value] of Object.entries(state.filters)) if (value) params.set(key, value);
  const url = new URL(window.location.href);
  url.hash = params.toString();
  history.replaceState(null, '', url);
}
function readHash() {
  const params = new URLSearchParams(window.location.hash.slice(1));
  for (const key of Object.keys(state.filters)) state.filters[key] = params.get(key) || (key === 'search' ? '' : null);
  $('search').value = state.filters.search;
}
function filterItems() {
  const {date,topic,person,search} = state.filters;
  const term = (search || '').trim().toLocaleLowerCase();
  state.filtered = state.items.filter(item => {
    if (date && item.broadcast_date !== date) return false;
    if (topic && !(item.topics || []).some(t => t.topic_id === topic || t.name === topic)) return false;
    if (person && !(item.people || []).some(p => (p.name_chinese || p.name) === person)) return false;
    if (!term) return true;
    const fields = [item.title, item.summary, item.excerpt,
      ...(item.keywords || []), ...(item.people || []).map(p => p.name_chinese || p.name),
      ...(item.organizations || []).map(o => o.name)];
    return fields.some(field => text(field).toLocaleLowerCase().includes(term));
  });
}
function renderFilters() {
  const target = clear($('filters'));
  const descriptions = {date:'日期',topic:'主题',person:'人物',search:'检索'};
  for (const [key,value] of Object.entries(state.filters)) {
    if (value) add(target, action(`${descriptions[key]}：${value} ×`, () => {
      state.filters[key] = key === 'search' ? '' : null;
      $('search').value = state.filters.search; state.shown = 60; syncHash(); render();
    }, 'pill'));
  }
  $('clear').disabled = !Object.values(state.filters).some(Boolean);
}
function renderKpis() {
  const target = clear($('kpis'));
  const all = state.filtered;
  for (const [label,value] of [['当前结果',all.length],['数据总条目',state.items.length],
    ['含摘要',all.filter(item => item.summary).length],
    ['当前日期数',new Set(all.map(item => item.broadcast_date)).size]]) {
    const pill = node('div','kpi'); add(pill,node('span','',label+' '),node('strong','',value)); add(target,pill);
  }
}
function renderDates() {
  const target = clear($('dates'));
  const maximum = Math.max(1,...state.dates.map(d => Number(d.item_count) || 0));
  for (const date of state.dates) {
    const button = action('', () => updateFilter('date', date.date),
      'entry timeline-row' + (state.filters.date === date.date ? ' active' : ''));
    add(button,node('span','',date.date));
    const track = node('span'); const bar = node('span','bar');
    bar.style.width = `${Math.min(100,Math.max(0,(Number(date.item_count)||0)/maximum*100))}%`;
    add(track,bar); add(button,track,node('span','',Number(date.item_count)||0)); add(target,button);
  }
  if (!state.dates.length) empty(target,'暂无日期统计');
}
function renderTopics() {
  const target = clear($('topics'));
  const topics = [...state.topics].sort((a,b) => (b.article_count||0)-(a.article_count||0)).slice(0,24);
  for (const topic of topics) {
    const id = topic.topic_id || topic.name;
    const button = action(topic.name, () => updateFilter('topic',id),
      'tile' + (state.filters.topic === id ? ' active' : ''));
    add(button,node('small','',`${Number(topic.article_count)||0} 条`)); add(target,button);
  }
  if (!topics.length) empty(target,'暂无主题数据');
}
function renderPeople() {
  const target = clear($('people')); const counts = new Map();
  for (const item of state.filtered) for (const person of (item.people || [])) {
    const name = text(person.name_chinese || person.name);
    if (name) counts.set(name,(counts.get(name)||0)+1);
  }
  const people = [...counts].sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0],'zh')).slice(0,20);
  for (const [name,count] of people) add(target,
    action(`${name} · ${count} 条`, () => updateFilter('person',name),
      'entry' + (state.filters.person === name ? ' active' : '')));
  if (!people.length) empty(target,'当前筛选没有人物关联');
}
function field(parent, heading, value) {
  if (value === null || value === undefined || value === '') return;
  const section = node('section'); add(section,node('h3','',heading),node('p','',value)); add(parent,section);
}
function chips(parent, heading, values) {
  if (!values.length) return;
  const section = node('section'); add(section,node('h3','',heading));
  const tags = node('div','tags');
  for (const value of values) if (text(value)) add(tags,node('span','tag',value));
  add(section,tags); add(parent,section);
}
function safeSource(raw) {
  if (typeof raw !== 'string' || !raw.trim()) return null;
  try {
    const url = new URL(raw);
    return url.protocol === 'https:' || url.protocol === 'http:' ? url.href : null;
  } catch (_) { return null; }
}
function openDetail(title) {
  previousFocus = document.activeElement;
  $('detail-title').textContent = text(title);
  clear($('detail-body')); $('detail').showModal();
}
function showNews(item) {
  openDetail(item.title);
  const body = $('detail-body');
  field(body,'播出日期 / 顺序',`${text(item.broadcast_date)} · ${text(item.order_in_broadcast)}`);
  field(body,item.summary ? '摘要（可能由 AI 生成，请核对来源）' : '原文摘录',item.summary || item.excerpt);
  chips(body,'主题',(item.topics||[]).map(t => t.name));
  chips(body,'关键词',item.keywords||[]);
  chips(body,'人物',(item.people||[]).map(p => p.name_chinese || p.name));
  chips(body,'机构',(item.organizations||[]).map(o => o.name));
  const url = safeSource(item.url);
  if (url) { const section = node('section'); const link = node('a','','查看来源页面');
    link.href = url; link.target = '_blank'; link.rel = 'noopener noreferrer';
    add(section,link); add(body,section); }
}
function showEvent(event) {
  openDetail(event.name);
  const body = $('detail-body');
  field(body,'解释范围','事件聚类、类型、热度和状态属于算法或模型推断，并非独立事实核验。');
  field(body,'时间范围',`${text(event.first_date)} → ${text(event.last_date)}`);
  field(body,'类型 / 状态',`${text(event.type)} · ${text(event.status)}`);
  field(body,'事件摘要（可能由 AI 生成，请核对来源）',event.summary);
  const section = node('section'); add(section,node('h3','','关联报道'));
  const list = node('div','list');
  for (const linked of (event.items || []).slice(0,60)) {
    const found = state.items.find(item => item.news_id === linked.news_id);
    add(list,action(`${text(linked.date)} · ${text(linked.title)}`,
      () => { $('detail').close(); if (found) showNews(found); },'entry'));
  }
  if (!list.childElementCount) empty(list,'暂无已关联的新闻条目');
  add(section,list); add(body,section);
}
function renderEvents() {
  const target = clear($('events'));
  const relevant = state.events.filter(event =>
    !state.filters.date || (event.items||[]).some(item => item.date === state.filters.date));
  const top = relevant.sort((a,b) => (Number(b.heat_score)||0)-(Number(a.heat_score)||0)).slice(0,12);
  for (const event of top) {
    const button = action('', () => showEvent(event),'entry');
    add(button,node('strong','',event.name),
      node('small','',`${text(event.first_date)} → ${text(event.last_date)} · ${Number(event.news_count)||0} 条关联报道 · ${text(event.status)}`));
    add(target,button);
  }
  if (!top.length) empty(target,'暂无匹配的事件聚类');
}
function renderNews() {
  const target = clear($('news'));
  const items = state.filtered;
  $('result-count').textContent = `显示 ${Math.min(items.length,state.shown)} / ${items.length} 条`;
  for (const item of items.slice(0,state.shown)) {
    const button = action('', () => showNews(item),'entry');
    add(button,node('small','',`${text(item.broadcast_date)} · 第 ${text(item.order_in_broadcast)} 条`),
      node('strong','',item.title),node('small','',text(item.summary || item.excerpt).slice(0,180)));
    add(target,button);
  }
  if (!items.length) empty(target,'没有匹配的新闻条目');
  $('more').hidden = items.length <= state.shown;
}
function render() {
  filterItems(); renderFilters(); renderKpis(); renderDates(); renderTopics(); renderPeople(); renderEvents(); renderNews();
}
async function loadData() {
  const [news,topics,dates,events] = await Promise.all([
    fetch('../data/news_items.jsonl'),fetch('../data/topics.json'),
    fetch('../data/dates.json'),fetch('../data/events.json')]);
  if (![news,topics,dates].every(response => response.ok)) throw new Error('数据文件缺失，请先运行 db/export_jsonl.py');
  const content = await news.text();
  const items = content.split(/\r?\n/).filter(line => line.trim()).map(line => JSON.parse(line));
  const topicData = await topics.json(), dateData = await dates.json();
  const eventData = events.ok ? await events.json() : [];
  if (![items,topicData,dateData,eventData].every(Array.isArray)) throw new Error('数据格式不符合预期');
  return {items,topics:topicData,dates:dateData,events:eventData};
}
$('search').addEventListener('input',event => { state.filters.search = event.target.value; state.shown = 60; syncHash(); render(); });
$('clear').addEventListener('click',() => {
  state.filters = {date:null,topic:null,person:null,search:''}; $('search').value = '';
  state.shown = 60; syncHash(); render();
});
$('more').addEventListener('click',() => { state.shown += 60; renderNews(); });
$('close').addEventListener('click',() => $('detail').close());
$('detail').addEventListener('close',() => { if (previousFocus && previousFocus.isConnected) previousFocus.focus(); });
$('detail').addEventListener('click',event => { if (event.target === $('detail')) $('detail').close(); });
window.addEventListener('hashchange',() => { readHash(); state.shown = 60; render(); });
(async () => {
  try {
    Object.assign(state,await loadData());
    state.items.sort((a,b) => text(b.broadcast_date).localeCompare(text(a.broadcast_date)) ||
      (Number(a.order_in_broadcast)||0)-(Number(b.order_in_broadcast)||0));
    state.dates.sort((a,b) => text(b.date).localeCompare(text(a.date)));
    readHash(); render();
    const newest = state.dates[0]?.date || '未知';
    const oldest = state.dates[state.dates.length-1]?.date || '未知';
    $('coverage').textContent = `本地数据快照 · 覆盖 ${oldest} 至 ${newest} · 不代表实时新闻`;
    $('status').textContent = `加载完成：${state.items.length} 条新闻、${state.events.length} 个算法事件聚类。`;
  } catch (error) {
    $('coverage').textContent = '无法读取数据快照';
    $('status').textContent = `加载失败：${text(error.message)}。请通过项目根目录的 HTTP 服务打开此页面。`;
  }
})();
</script>
</body>
</html>
