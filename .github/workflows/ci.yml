name: Ontology checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install documented runtime dependencies
        run: python -m pip install requests beautifulsoup4 pypinyin
      - name: Compile Python modules
        run: python -m compileall -q db scraper tests
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v
      - name: CLI import and help smoke checks
        run: |
          python db/main.py --help
          python scraper/main.py --help

  event-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic gold ablations (not real-world accuracy)
        run: python eval/run_event_ablations.py --fixture eval/datasets/synthetic_event_gold.json
      - name: Read-only historical cluster diagnostics
        run: python eval/run_event_ablations.py --input data/news_items.jsonl
      - name: Generate unlabeled reviewer queue
        run: python eval/make_annotation_queue.py --output /tmp/event-pairs.jsonl --limit 10

  b3-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic B3 oracle demo (explicit gold-label leakage)
        run: |
          python eval/run_b3_experiment.py \
            --fixture eval/datasets/synthetic_event_gold.json \
            --oracle-demo --output /tmp/b3-synthetic-oracle.json
      - name: B3 provenance and semantic unit tests
        run: python -m unittest tests.test_semantic_recall_b3 -v
      - name: Embedding CLI help without optional model dependency
        run: python eval/build_embeddings_b3.py --help

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Headless browser tests on hostile fixtures and tracked snapshot
        run: python -m unittest discover -s tests -p 'test_browser_*.py' -v
