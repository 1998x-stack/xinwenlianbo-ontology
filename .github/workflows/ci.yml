name: Ontology checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install documented runtime dependencies
        run: python -m pip install requests beautifulsoup4 pypinyin
      - name: Compile Python modules
        run: python -m compileall -q db scraper tests
      - name: Offline regression suite
        run: python -m unittest discover -s tests -v
      - name: CLI import and help smoke checks
        run: |
          python db/main.py --help
          python scraper/main.py --help

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Headless browser tests on hostile fixtures and tracked snapshot
        run: python -m unittest discover -s tests -p 'test_browser_*.py' -v
